<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xóa vật liệu</title>
<style>
:root{font-family:Arial,sans-serif;color:#18212b}body{margin:0;padding:24px;background:#f5f7f9}.head{display:flex;gap:12px;align-items:center;margin-bottom:18px}.mark{width:42px;height:42px;border-radius:10px;background:#126b5b;color:#fff;display:grid;place-items:center;font-weight:bold}h1{font-size:19px;margin:0}p{color:#5e6873;line-height:1.45}.panel{background:#fff;border:1px solid #dce2e7;border-radius:8px;padding:16px}.label{font-size:12px;color:#69747f;text-transform:uppercase}.value{margin-top:6px;font-weight:bold;overflow-wrap:anywhere}button{width:100%;border:0;border-radius:6px;padding:12px 14px;margin-top:12px;font-size:14px;cursor:pointer}.primary{background:#126b5b;color:#fff}.secondary{background:#e8eef0;color:#18212b}#status{min-height:42px;margin:0;font-size:13px}footer{text-align:right;color:#7b858e;font-size:12px;margin-top:16px}
</style></head>
<body><header class="head"><div class="mark">TT</div><div><h1>Xóa vật liệu</h1><p style="margin:3px 0 0">TRẦN TUẤN · SketchUp</p></div></header>
<section class="panel"><div class="label">Vật liệu hiện tại</div><div id="material" class="value">Đang đọc...</div><div class="label" style="display:block;margin-top:16px">Đối tượng được chọn</div><div id="selection" class="value">0</div><p id="status">Chọn mặt, group hoặc component rồi bấm nút bên dưới.</p><button class="primary" onclick="sketchup.remove_material()">Xóa vật liệu đang chọn</button><button class="secondary" onclick="sketchup.refresh()">Làm mới trạng thái</button></section>
<footer>Phiên bản <span id="version">1.0.13</span></footer>
<script>window.TTMaterial={refresh(data){material.textContent=data.material;selection.textContent=data.selection;version.textContent=data.version},status(message){status.textContent=message}};</script></body></html>
