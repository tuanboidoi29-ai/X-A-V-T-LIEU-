<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TT - Xóa vật liệu</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 24px; color: #18212b; background: #f5f7f9; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .mark { width: 42px; height: 42px; border-radius: 10px; background: #126b5b; color: #fff; display: grid; place-items: center; font-weight: 700; }
    h1 { font-size: 19px; margin: 0; } p { color: #5e6873; line-height: 1.45; }
    .panel { background: #fff; border: 1px solid #dce2e7; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
    .label { font-size: 12px; color: #69747f; text-transform: uppercase; letter-spacing: .04em; }
    .value { margin-top: 6px; font-weight: 700; overflow-wrap: anywhere; }
    button { width: 100%; border: 0; border-radius: 6px; padding: 12px 14px; margin-top: 9px; font-size: 14px; cursor: pointer; }
    .primary { background: #126b5b; color: #fff; } .secondary { background: #e8eef0; color: #18212b; }
    input { box-sizing: border-box; width: 100%; border: 1px solid #cbd4da; border-radius: 5px; padding: 10px; margin-top: 6px; font-size: 14px; }
    #status { min-height: 42px; margin: 0; font-size: 13px; }
    footer { text-align: right; color: #7b858e; font-size: 12px; }
  </style>
</head>
<body>
  <header><div class="mark">TT</div><div><h1>Xóa vật liệu</h1><p style="margin:3px 0 0">TRẦN TUẤN · SketchUp</p></div></header>
  <section class="panel">
    <div class="label">Vật liệu hiện tại</div><div id="material" class="value">Đang đọc...</div>
    <div class="label" style="margin-top:14px">Đối tượng được chọn</div><div id="selection" class="value">0</div>
  </section>
  <section class="panel">
    <p id="status">Chọn vật liệu trong Materials và chọn mặt hoặc group cần xử lý.</p>
    <button class="primary" onclick="sketchup.remove_material()">Xóa vật liệu đang chọn</button>
    <label class="label" for="width">Chiều rộng ván (mm)</label>
    <input id="width" type="number" min="0.1" step="1" value="600">
    <label class="label" for="thickness">Độ dày ván (mm)</label>
    <input id="thickness" type="number" min="0.1" step="0.1" value="18">
    <button class="primary" onclick="sketchup.draw_board(width.value, thickness.value)">Vẽ ván bằng chuột</button>
    <button class="secondary" onclick="sketchup.refresh()">Làm mới trạng thái</button>
    <button class="secondary" onclick="sketchup.check_update()">Kiểm tra bản cập nhật</button>
  </section>
  <footer>Phiên bản <span id="version">1.0.0</span></footer>
  <script>
    window.TTMaterial = {
      refresh(data) { material.textContent = data.material; selection.textContent = data.selection; version.textContent = data.version; },
      status(message) { status.textContent = message; },
      update(data) { status.textContent = 'Có phiên bản ' + data.version + '. Tải bản cập nhật: ' + data.url; }
    };
  </script>
</body>
</html>
