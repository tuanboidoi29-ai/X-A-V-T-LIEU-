<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kiểm tra bản cập nhật</title>
<style>
:root{font-family:Arial,sans-serif;color:#18212b}body{margin:0;padding:24px;background:#f5f7f9}.head{display:flex;gap:12px;align-items:center;margin-bottom:18px}.mark{width:42px;height:42px;border-radius:10px;background:#126b5b;color:#fff;display:grid;place-items:center;font-weight:bold}h1{font-size:19px;margin:0}p{color:#5e6873;line-height:1.45}.panel{background:#fff;border:1px solid #dce2e7;border-radius:8px;padding:16px}.info{display:flex;justify-content:space-between;border-bottom:1px solid #e5e9ec;padding:10px 0;color:#5e6873}.info b{color:#18212b}button{width:100%;border:0;border-radius:6px;padding:12px;margin-top:14px;font-size:14px;cursor:pointer}.primary{background:#126b5b;color:#fff}.secondary{background:#e8eef0;color:#18212b}#status{min-height:55px;font-size:13px}footer{text-align:right;color:#7b858e;font-size:12px;margin-top:16px}
</style></head>
<body><header class="head"><div class="mark">TT</div><div><h1>Kiểm tra bản cập nhật</h1><p style="margin:3px 0 0">TT-pro · Cập nhật trực tiếp</p></div></header><section class="panel"><div class="info"><span>Phiên bản đang dùng</span><b id="version">1.0.13</b></div><div class="info"><span>Nguồn cập nhật</span><b>GitHub</b></div><p id="status">Bấm nút để kiểm tra phiên bản mới. Nếu có bản mới, plugin sẽ tải và cài RBZ tự động.</p><button class="primary" onclick="sketchup.check_update()">Kiểm tra bản cập nhật</button><button class="secondary" onclick="sketchup.refresh()">Làm mới trạng thái</button></section><footer>Không cần khởi động lại SketchUp</footer><script>window.TTMaterial={refresh(data){version.textContent=data.version},status(message){status.textContent=message}};</script></body></html>
